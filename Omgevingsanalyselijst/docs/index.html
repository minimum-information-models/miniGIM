<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omgevingsanalyselijst Viewer - miniGIM</title>
  <meta name="description" content="Een interactieve, dynamische viewer voor de Omgevingsanalyselijst van het minimum-information-models/miniGIM project. Filter, zoek en sorteer door alle modules.">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- Header Section -->
    <header id="app-header">
      <div class="brand-section">
        <h1>Omgevingsanalyselijst</h1>
        <p>Minimum Informatie Model voor de Omgevingswet (miniGIM)</p>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Schakel donker/licht thema in">
          <!-- Sun Icon (for dark theme) -->
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <!-- Moon Icon (for light theme) -->
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Stats Dashboard Section -->
    <section class="stats-container" aria-label="Statistieken dashboard">
      <div class="stat-card" id="card-total-items">
        <div class="stat-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="stat-total-items">-</span>
          <span class="stat-label">Onderdelen</span>
        </div>
      </div>
      
      <div class="stat-card" id="card-modules">
        <div class="stat-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="stat-modules">-</span>
          <span class="stat-label">Modules</span>
        </div>
      </div>

      <div class="stat-card" id="card-high-risk">
        <div class="stat-icon" style="color: #ef4444;">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="stat-high-risk">-</span>
          <span class="stat-label">Hoge Risico's</span>
        </div>
      </div>

      <div class="stat-card" id="card-sources">
        <div class="stat-icon" style="color: #10b981;">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="stat-sources">-</span>
          <span class="stat-label">Databronnen</span>
        </div>
      </div>
    </section>

    <!-- Search Section -->
    <section class="search-filter-section" aria-label="Zoeken en filteren">
      <div class="search-wrapper">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input type="text" id="search-input" class="search-input" placeholder="Typ om te zoeken op onderdeel, risico, bron, toelichting..." aria-label="Zoek in tabel">
      </div>
    </section>

    <!-- Main Layout: Sidebar & Content Area -->
    <div class="main-layout">
      <!-- Sidebar for Modules Navigation -->
      <aside class="sidebar" aria-label="Module selectie">
        <div class="module-nav-container">
          <h2 class="sidebar-title">Modules</h2>
          <nav id="module-list" class="module-list" aria-label="Lijst van modules"></nav>
        </div>
      </aside>

      <!-- Main Content Area with Table -->
      <main class="content-area">
        <div class="table-card">
          <div class="table-wrapper">
            <table id="data-table">
              <thead>
                <tr>
                  <th data-sort="Onderdeel" id="th-onderdeel">Onderdeel <span class="sort-indicator">↕</span></th>
                  <th data-sort="Relevantie" id="th-relevantie" style="width: 130px;">Relevantie <span class="sort-indicator">↕</span></th>
                  <th data-sort="Risico" id="th-risico" style="width: 130px;">Risico <span class="sort-indicator">↕</span></th>
                  <th data-sort="Databron(nen)" id="th-databron" style="width: 180px;">Databron(nen) <span class="sort-indicator">↕</span></th>
                  <th data-sort="Ontsluiter" id="th-ontsluiter" class="hide-on-mobile" style="width: 150px;">Ontsluiter <span class="sort-indicator">↕</span></th>
                </tr>
              </thead>
              <tbody id="table-body">
                <!-- JavaScript will populate rows here -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
